
{% extends "admin/base_site.html" %}
{% load i18n %}

{% block content %}
<div class="cb-admin-container">
  <section class="cb-admin-card">
    <h1 class="cb-admin-card-title">📅 {% trans "Generate Daily Report" %}</h1>

    <form method="post">
        {% csrf_token %}
        <label for="id_fecha"><strong>{% trans "Select a date:" %}</strong></label>
        {{ form.fecha }}

        <button type="submit" class="btn-admin-action">
            {% trans "Generate report" %}
        </button>
    </form>

    <a href="{% url 'admin:reports_reportediario_changelist' %}"
       class="btn-admin-action">
        {% trans "Back" %}
    </a>
  </section>
</div>
{% endblock %}
